<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcora — maquette : le Planétarium</title>
<style>
  /*
   * LE PLANÉTARIUM — troisième passe, sur retour du 03.08.2026 : « encore plus
   * fort, plus animé, plus de mouvements ». Version dédiée, seule variante.
   *
   * Ce qui bouge, du fond vers l'avant :
   *  1. le CIEL ENTIER tourne autour de son pôle (en haut à droite), comme le
   *     vrai autour de l'étoile polaire — un tour en 6 minutes, perceptible ;
   *  2. trois profondeurs d'étoiles en parallaxe, la plus proche dérive le plus ;
   *  3. vingt-six étoiles scintillent en décalé, six brillantes avec halo ;
   *  4. une étoile filante toutes les ~3 s (cinq exemplaires déphasés) ;
   *  5. trois voiles de nébuleuse (or, bleu, violet) dérivent en se fondant ;
   *  6. la Grande Ourse rayonne, Mizar et Alcor battent comme un pouls ;
   *  7. un satellite traverse toutes les ~90 s, clignotant.
   * Toujours transform/opacity seulement ; prefers-reduced-motion fige tout.
   */
  :root{
    --bg:#101318; --card:#23272e; --line:#353b44; --line2:#434a55;
    --ink:#dad5cb; --muted:#9a958b; --soft:#75716a;
    --accent:#d2a263; --accent-soft:#322a1d; --accent-d:#e6b877;
    /* Verre 3e passe : le flou de 26 px ETALAIT les etoiles ponctuelles jusqu'a
       les effacer — c'est lui qui rendait le panneau opaque. Un verre qui montre
       un ciel etoile doit flouter PEU : 8 px adoucit sans aneantir, et le voile
       blanc tombe a 2 % — le ciel EST le fond du panneau, le verre sa texture. */
    --verre-fond:rgba(255,255,255,.02); --verre-bord:rgba(255,255,255,.18);
    --verre-flou:blur(8px) saturate(160%);
    --force:1;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
       font:13px/1.5 "Segoe UI",system-ui,sans-serif}

  .fond{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(120% 90% at 78% 12%,#181d26 0%,#12161c 55%,#0e1116 100%)}
  .couches{position:absolute;inset:0;opacity:var(--force)}
  .couches *{will-change:transform,opacity}

  /* ---- 1+2 · le ciel qui tourne, trois profondeurs ------------------------ */
  /* 4e passe : c'est le DEPLACEMENT qui etait trop rapide, pas le clignotement.
     Le vrai ciel met 24 h par tour ; le notre met desormais UNE HEURE — assez
     lent pour ne jamais « filer », assez vivant pour qu'en y revenant apres un
     the, les etoiles aient bouge. La vie de l'instant, ce sont le scintillement,
     les filantes, les voiles et le satellite — pas la rotation. */
  .ciel-rotatif{position:absolute;inset:-42%;transform-origin:76% 22%;
    animation:tourne 3600s linear infinite}
  @keyframes tourne{to{transform:rotate(360deg)}}
  .voie{position:absolute;inset:0;background-repeat:repeat}
  .voie.p1{opacity:1;
    background-image:url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22640%22%3E%3Cg fill=%22%23f2efe8%22%3E%3Ccircle cx=%2237%22 cy=%2261%22 r=%221.5%22 opacity=%22.9%22/%3E%3Ccircle cx=%22243%22 cy=%2244%22 r=%221.2%22 opacity=%22.75%22/%3E%3Ccircle cx=%22468%22 cy=%2288%22 r=%221.5%22 opacity=%22.9%22/%3E%3Ccircle cx=%2286%22 cy=%22287%22 r=%221.1%22 opacity=%22.7%22/%3E%3Ccircle cx=%22333%22 cy=%22279%22 r=%221.5%22 opacity=%22.85%22/%3E%3Ccircle cx=%22611%22 cy=%22293%22 r=%221.2%22 opacity=%22.7%22/%3E%3Ccircle cx=%22183%22 cy=%22512%22 r=%221.3%22 opacity=%22.8%22/%3E%3Ccircle cx=%22452%22 cy=%22516%22 r=%221.5%22 opacity=%22.9%22/%3E%3Ccircle cx=%22119%22 cy=%22617%22 r=%221.1%22 opacity=%22.7%22/%3E%3Ccircle cx=%22399%22 cy=%22601%22 r=%221.3%22 opacity=%22.75%22/%3E%3C/g%3E%3C/svg%3E')}
  .voie.p2{opacity:.65;background-size:470px;
    background-image:url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22640%22%3E%3Cg fill=%22%23dad5cb%22%3E%3Ccircle cx=%22131%22 cy=%22142%22 r=%221%22 opacity=%22.6%22/%3E%3Ccircle cx=%22355%22 cy=%22190%22 r=%22.9%22 opacity=%22.55%22/%3E%3Ccircle cx=%22598%22 cy=%22161%22 r=%221%22 opacity=%22.6%22/%3E%3Ccircle cx=%22214%22 cy=%22341%22 r=%22.9%22 opacity=%22.5%22/%3E%3Ccircle cx=%22471%22 cy=%22344%22 r=%221%22 opacity=%22.6%22/%3E%3Ccircle cx=%2251%22 cy=%22468%22 r=%22.9%22 opacity=%22.55%22/%3E%3Ccircle cx=%22317%22 cy=%22447%22 r=%22.9%22 opacity=%22.5%22/%3E%3Ccircle cx=%22585%22 cy=%22461%22 r=%221%22 opacity=%22.6%22/%3E%3Ccircle cx=%22262%22 cy=%22655%22 r=%22.9%22 opacity=%22.5%22/%3E%3Ccircle cx=%22540%22 cy=%22648%22 r=%221%22 opacity=%22.55%22/%3E%3C/g%3E%3C/svg%3E');
    animation:parallaxe-2 700s ease-in-out infinite alternate}
  .voie.p3{opacity:.4;background-size:330px;
    background-image:url('data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22640%22%3E%3Cg fill=%22%23bdb7ac%22%3E%3Ccircle cx=%2290%22 cy=%2280%22 r=%22.7%22 opacity=%22.5%22/%3E%3Ccircle cx=%22280%22 cy=%22150%22 r=%22.6%22 opacity=%22.45%22/%3E%3Ccircle cx=%22500%22 cy=%2260%22 r=%22.7%22 opacity=%22.5%22/%3E%3Ccircle cx=%22160%22 cy=%22330%22 r=%22.6%22 opacity=%22.4%22/%3E%3Ccircle cx=%22420%22 cy=%22280%22 r=%22.7%22 opacity=%22.5%22/%3E%3Ccircle cx=%22600%22 cy=%22380%22 r=%22.6%22 opacity=%22.45%22/%3E%3Ccircle cx=%2260%22 cy=%22560%22 r=%22.7%22 opacity=%22.45%22/%3E%3Ccircle cx=%22340%22 cy=%22500%22 r=%22.6%22 opacity=%22.4%22/%3E%3Ccircle cx=%22560%22 cy=%22610%22 r=%22.7%22 opacity=%22.5%22/%3E%3C/g%3E%3C/svg%3E');
    animation:parallaxe-3 500s ease-in-out infinite alternate}
  @keyframes parallaxe-2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-46px,26px,0)}}
  @keyframes parallaxe-3{from{transform:translate3d(0,0,0)}to{transform:translate3d(60px,-38px,0)}}

  /* ---- 3 · les vivantes ---------------------------------------------------- */
  /* Scintillement RALENTI ×4 (deux retours du 03.08) — les filantes, elles,
     gardent leur vitesse : c'est leur brièveté qui les rend vivantes. */
  .sc{position:absolute;width:3px;height:3px;border-radius:50%;background:#f2efe8;
    box-shadow:0 0 7px 1px rgba(242,239,232,.85);
    animation:scintille calc(var(--d)*4) ease-in-out infinite var(--a)}
  .sc.brillante{width:4px;height:4px;
    box-shadow:0 0 12px 3px rgba(242,239,232,.9),0 0 26px 6px rgba(210,162,99,.35);
    animation:brille calc(var(--d)*4) ease-in-out infinite var(--a)}
  @keyframes scintille{0%,100%{opacity:.12;transform:scale(.65)}50%{opacity:1;transform:scale(1.2)}}
  @keyframes brille{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.45)}}

  /* ---- 4 · les filantes ----------------------------------------------------
     Cinq exemplaires déphasés : en moyenne, une toutes les trois secondes. */
  .filante{position:absolute;width:170px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55) 55%,#fff 82%,transparent);
    opacity:0;transform:rotate(var(--r,16deg));
    animation:file var(--p) linear infinite var(--a)}
  .filante::after{content:"";position:absolute;right:26px;top:-1.5px;width:5px;height:5px;
    border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.8)}
  @keyframes file{
    0%   {opacity:0;transform:translate3d(0,0,0) rotate(var(--r,16deg))}
    1%   {opacity:1}
    7%   {opacity:0;transform:translate3d(var(--tx,62vw),var(--ty,18vw),0) rotate(var(--r,16deg))}
    100% {opacity:0;transform:translate3d(var(--tx,62vw),var(--ty,18vw),0) rotate(var(--r,16deg))}}

  /* ---- 5 · les voiles de nébuleuse ----------------------------------------- */
  .voile{position:absolute;mix-blend-mode:screen;border-radius:50%}
  .voile.n1{width:70vw;height:46vw;left:2%;top:-16%;
    background:radial-gradient(50% 50% at 50% 50%,rgba(210,162,99,.34) 0%,rgba(210,162,99,.10) 48%,transparent 72%);
    animation:nebule1 52s ease-in-out infinite alternate}
  .voile.n2{width:60vw;height:44vw;left:-18%;top:34%;
    background:radial-gradient(50% 50% at 50% 50%,rgba(120,166,224,.26) 0%,rgba(120,166,224,.08) 50%,transparent 74%);
    animation:nebule2 64s ease-in-out infinite alternate}
  .voile.n3{width:48vw;height:38vw;left:56%;top:46%;
    background:radial-gradient(50% 50% at 50% 50%,rgba(155,134,201,.24) 0%,transparent 70%);
    animation:nebule3 44s ease-in-out infinite alternate}
  @keyframes nebule1{from{transform:translate3d(0,0,0) rotate(0deg) scale(1)}to{transform:translate3d(-13vw,9vh,0) rotate(9deg) scale(1.22)}}
  @keyframes nebule2{from{transform:translate3d(0,0,0) rotate(0deg) scale(1.1)}to{transform:translate3d(13vw,-9vh,0) rotate(-7deg) scale(.9)}}
  @keyframes nebule3{from{transform:translate3d(0,0,0) scale(.92)}to{transform:translate3d(-9vw,-13vh,0) scale(1.26)}}

  /* ---- 6 · la Grande Ourse -------------------------------------------------
     Elle NE tourne PAS avec le ciel : c'est la marque, elle préside. */
  .ourse{position:absolute;right:2vw;top:34px;width:600px;height:400px;opacity:.34}
  .ourse svg{width:100%;height:100%;overflow:visible}
  .ourse .traits{animation:palpite-t 4.5s ease-in-out infinite}
  .ourse .astres{animation:palpite-a 4.5s ease-in-out infinite}
  .ourse .couple circle{animation:pouls 3.2s ease-in-out infinite}
  .ourse .couple circle:last-child{animation-delay:.35s}
  .ourse .halo-couple{animation:pouls-halo 3.2s ease-in-out infinite}
  @keyframes palpite-t{0%,100%{opacity:.45}50%{opacity:.85}}
  @keyframes palpite-a{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes pouls{0%,100%{transform:scale(1)}45%{transform:scale(1.35)}}
  @keyframes pouls-halo{0%,100%{opacity:.15;transform:scale(.9)}45%{opacity:.5;transform:scale(1.25)}}

  /* ---- 7 · le satellite ----------------------------------------------------
     Un point discret, trajectoire rectiligne, clignotement régulier. */
  .satellite{position:absolute;left:-4%;top:64%;width:2.5px;height:2.5px;border-radius:50%;
    background:#cfd6e2;box-shadow:0 0 5px 1px rgba(207,214,226,.7);
    animation:passe 88s linear infinite, clignote 1.6s steps(2,jump-none) infinite}
  @keyframes passe{
    0%{opacity:0;transform:translate3d(0,0,0)}
    2%{opacity:.9}
    44%{opacity:.9;transform:translate3d(108vw,-30vh,0)}
    45%,100%{opacity:0;transform:translate3d(108vw,-30vh,0)}}
  @keyframes clignote{50%{opacity:.25}}

  @media (prefers-reduced-motion:reduce){ .fond *{animation:none !important} }

  /* ------------------------------------------------ la fausse application -- */
  .app{position:relative;z-index:1;height:100%;display:flex}
  .rail{width:52px;display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 0;border-right:1px solid var(--verre-bord);
    background:var(--verre-fond);
    -webkit-backdrop-filter:var(--verre-flou);backdrop-filter:var(--verre-flou)}
  .rail i{width:36px;height:36px;border-radius:8px;display:block}
  .rail i.on{background:var(--accent-soft)}
  .rail i:not(.on){background:rgba(255,255,255,.04)}
  .panneau{width:250px;border-right:1px solid var(--verre-bord);
    background:var(--verre-fond);
    -webkit-backdrop-filter:var(--verre-flou);backdrop-filter:var(--verre-flou);
    padding:14px;display:flex;flex-direction:column;gap:8px}
  .panneau h4{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .panneau .l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .panneau .l b{font-family:Consolas,monospace;font-weight:500;color:var(--ink);font-size:11px}
  .panneau .jauge{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .panneau .jauge i{display:block;height:100%;width:96%;
    background:linear-gradient(90deg,var(--accent),var(--accent-d))}
  /* Les tuiles FLOTTENT sur le ciel : ombre portee profonde (deux distances),
     bord de verre clair plutot que le trait sombre du theme plat, et un leger
     recul entre elles pour que le ciel respire autour. Sans cela, des rectangles
     noirs a bord dur semblaient POSES SUR l'image du fond — le « bizarre ». */
  .scene{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:26px;
    align-content:center}
  .tuile{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.16);
    background:#000;position:relative;aspect-ratio:16/9;
    box-shadow:0 24px 60px rgba(0,0,0,.60), 0 4px 14px rgba(0,0,0,.45),
               0 0 0 1px rgba(0,0,0,.35);
    transform:translateZ(0)}
  .tuile img{width:100%;height:100%;object-fit:cover;display:block;opacity:.94}
  .tuile .bandeau{position:absolute;inset-inline:0;top:0;height:26px;display:flex;
    align-items:center;padding:0 9px;font-size:11.5px;color:#f2f2f0;
    background:linear-gradient(180deg,rgba(10,12,15,.55),transparent)}
  @property --ah{syntax:'<angle>';initial-value:0deg;inherits:false}
  .halo{position:absolute;inset:0;padding:2px;pointer-events:none;
    background:conic-gradient(from var(--ah),transparent 0deg 250deg,
      var(--accent) 300deg,var(--accent-d) 332deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:haloT 2.6s linear infinite}
  @keyframes haloT{to{--ah:360deg}}

  .choix{position:fixed;right:14px;bottom:14px;z-index:9;display:flex;gap:10px;
    align-items:center;background:rgba(20,23,28,.72);border:1px solid var(--verre-bord);
    border-radius:10px;padding:8px 12px;
    -webkit-backdrop-filter:var(--verre-flou);backdrop-filter:var(--verre-flou)}
  .choix span{font-size:12px;color:var(--accent-d)}
  .choix label{font-size:11px;color:var(--soft);display:flex;gap:6px;align-items:center}
  .choix input[type=range]{width:130px;accent-color:var(--accent)}
</style>
<body>

<div class="fond" aria-hidden="true">
  <div class="couches">
    <div class="ciel-rotatif">
      <div class="voie p3"></div>
      <div class="voie p2"></div>
      <div class="voie p1"></div>
    </div>
    <div class="voile n1"></div>
    <div class="voile n2"></div>
    <div class="voile n3"></div>

    <i class="sc" style="left:12%;top:18%;--d:2.6s;--a:0s"></i>
    <i class="sc" style="left:31%;top:64%;--d:3.4s;--a:1.2s"></i>
    <i class="sc" style="left:47%;top:9%;--d:2.9s;--a:2.4s"></i>
    <i class="sc" style="left:66%;top:76%;--d:3.8s;--a:.6s"></i>
    <i class="sc" style="left:79%;top:31%;--d:3.1s;--a:3.1s"></i>
    <i class="sc" style="left:57%;top:44%;--d:4.2s;--a:1.8s"></i>
    <i class="sc" style="left:22%;top:86%;--d:2.8s;--a:4.2s"></i>
    <i class="sc" style="left:8%;top:47%;--d:3.3s;--a:2.9s"></i>
    <i class="sc" style="left:40%;top:30%;--d:3.7s;--a:.9s"></i>
    <i class="sc" style="left:88%;top:62%;--d:2.7s;--a:3.7s"></i>
    <i class="sc" style="left:71%;top:12%;--d:3.5s;--a:1.5s"></i>
    <i class="sc" style="left:16%;top:71%;--d:4s;--a:2.1s"></i>
    <i class="sc" style="left:52%;top:88%;--d:3.2s;--a:4.8s"></i>
    <i class="sc" style="left:93%;top:22%;--d:2.8s;--a:.3s"></i>
    <i class="sc" style="left:36%;top:50%;--d:3.6s;--a:2.7s"></i>
    <i class="sc" style="left:62%;top:26%;--d:2.9s;--a:4.5s"></i>
    <i class="sc" style="left:5%;top:8%;--d:3.9s;--a:1.1s"></i>
    <i class="sc" style="left:84%;top:84%;--d:3s;--a:3.4s"></i>
    <i class="sc" style="left:27%;top:37%;--d:4.1s;--a:.5s"></i>
    <i class="sc" style="left:74%;top:55%;--d:2.7s;--a:2.2s"></i>
    <i class="sc brillante" style="left:19%;top:26%;--d:4.6s;--a:0s"></i>
    <i class="sc brillante" style="left:45%;top:70%;--d:5.2s;--a:1.7s"></i>
    <i class="sc brillante" style="left:69%;top:40%;--d:4.9s;--a:3.3s"></i>
    <i class="sc brillante" style="left:33%;top:12%;--d:5.5s;--a:2.5s"></i>
    <i class="sc brillante" style="left:90%;top:74%;--d:4.4s;--a:4.1s"></i>
    <i class="sc brillante" style="left:10%;top:60%;--d:5s;--a:.8s"></i>

    <div class="filante" style="top:14%;--p:13s;--a:0s;--r:16deg;--tx:62vw;--ty:18vw"></div>
    <div class="filante" style="top:34%;--p:17s;--a:5s;--r:22deg;--tx:56vw;--ty:23vw"></div>
    <div class="filante" style="top:5%;--p:19s;--a:9s;--r:12deg;--tx:70vw;--ty:15vw"></div>
    <div class="filante" style="top:52%;--p:23s;--a:2.5s;--r:19deg;--tx:58vw;--ty:20vw"></div>
    <div class="filante" style="top:24%;--p:15s;--a:11s;--r:26deg;--tx:52vw;--ty:26vw"></div>

    <div class="satellite"></div>

    <div class="ourse">
      <svg viewBox="0 0 400 260">
        <circle class="halo-couple" cx="98" cy="67" r="22" fill="rgba(210,162,99,.25)"/>
        <g class="traits" stroke="#dad5cb" stroke-width="1.3" fill="none">
          <path d="M40 40 95 70 150 88 200 95 295 95 300 170 215 160 200 95"/>
        </g>
        <g class="astres" fill="#eae6dc">
          <circle cx="40" cy="40" r="3.6"/><circle cx="150" cy="88" r="3.6"/>
          <circle cx="200" cy="95" r="3.2"/><circle cx="295" cy="95" r="3.8"/>
          <circle cx="300" cy="170" r="3.4"/><circle cx="215" cy="160" r="3.4"/>

        <g fill="#e6b877" class="couple">

          <circle cx="104" cy="61" r="2.6" style="transform-origin:104px 61px"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<div class="app">
  <div class="rail"><i class="on"></i><i></i><i></i><i></i></div>
  <div class="panneau">
    <h4>État</h4>
    <div class="l"><span>Flux vidéo prêt.</span></div>
    <h4>Caméras</h4>
    <div class="l"><span>Allée</span><b>3840 × 2160</b></div>
    <div class="l"><span>Bureaux</span><b>2688 × 1512</b></div>

    <div class="l"><span>Profondeur</span><b>5 mois 14 j</b></div>

  </div>
  <div class="scene">
    <div class="tuile"><img src="../site/assets/allee.jpg" alt="">
      <div class="bandeau">Allée</div><div class="halo"></div></div>
    <div class="tuile"><img src="../site/assets/bureaux.jpg" alt="">
      <div class="bandeau">Bureaux</div></div>
  </div>
</div>

<div class="choix">
  <span>Le Planétarium</span>
  <label>Intensité
    <input type="range" min="25" max="100" value="100"
      oninput="document.documentElement.style.setProperty('--force', this.value/100)">
  </label>
</div>

</body>
