<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Aucune ressource externe : l'application doit fonctionner sans Internet.
         Verifie le 22.07.2026 : cette politique n'entrave pas le temps reel, la
         negociation WebRTC ne relevant pas de « connect-src ». -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:;
                   connect-src 'self' http://127.0.0.1:* ws://localhost:* http://localhost:*;
                   style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>Alcora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
